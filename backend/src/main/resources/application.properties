server.port=8080
server.error.include-message=always

# ---- MySQL (change the password to yours, or set the DB_PASSWORD environment variable) ----
spring.datasource.url=jdbc:mysql://localhost:3306/animal_alert?sslMode=DISABLED&allowPublicKeyRetrieval=true&serverTimezone=Asia/Kolkata
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:}

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# ---- Python detector service ----
detector.url=http://127.0.0.1:5000

# ---- Alert rule (demo values, NOT calibrated to real stopping distances) ----
# ignore detections below this confidence
alert.min-confidence=0.40
# the "my lane" zone = middle part of the picture (0.25 = 25% from the left edge)
alert.path-left=0.25
alert.path-right=0.75
# an animal whose box is at least this fraction of the picture height counts as "close"
alert.danger-height=0.25
